---
schema_version: '1.0'
routing:
  fallback_provider: spacepayments
  timeout_mode: fallback_on_timeout
  default_strategy: balanced
simulation:
  source: history
  minimum_samples: 20
  latency_method: mean
  failure_expired_share: 0.2
  latency_spread_sec: 0
calibration:
  enabled: false
  minimum_samples: 20
  prior_strength: 30
provider_overrides: {}
presets:
  balanced:
    weights:
      count_share: 2
      volume_share: 2
      conversion: 4
      load_safe: 2
      intensity: 2
      turnover_commitment: 2
      latency: 1
      economy: 0.5
    policy_priorities:
    - count_share
    - volume_share
    - conversion
    - load_safe
    - intensity
    - turnover_commitment
    - latency
    - economy
  conversion_first:
    policy_priorities:
    - conversion
    - load_safe
    weights:
      conversion: 3.0
      load_safe: 0.7
      economy: 0.3
  load_safe:
    weights:
      load_safe: 3.0
      intensity: 1.0
      conversion: 0.5
  economy_first:
    weights:
      economy: 3.0
      conversion: 0.8
      load_safe: 0.5
