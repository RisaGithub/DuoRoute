---
schema_version: '1.0'
routing:
  fallback_provider: spacepayments
  timeout_mode: fallback_on_timeout
simulation:
  source: history
  minimum_samples: 20
  latency_method: mean
  failure_expired_share: 0.2
  latency_spread_sec: 0
calibration:
  enabled: false
  minimum_samples: 20
  prior_strength: 30
provider_overrides: {}
presets:
  balanced:
    policy_priorities:
    - count_share
    - volume_share
    - turnover_commitment
    - conversion
    - load_safe
    - cascade
    - preferred_amount
    - intensity
    - economy
    weights:
      count_share: 2.0
      volume_share: 1.8
      cascade: 0.6
      preferred_amount: 0.8
      conversion: 1.2
      load_safe: 1.3
      intensity: 0.5
      turnover_commitment: 1.4
      economy: 0.7
  conversion_first:
    policy_priorities:
    - conversion
    - load_safe
    weights:
      conversion: 3.0
      load_safe: 0.7
      economy: 0.3
  load_safe:
    weights:
      load_safe: 3.0
      intensity: 1.0
      conversion: 0.5
  economy_first:
    weights:
      economy: 3.0
      conversion: 0.8
      load_safe: 0.5
